<!DOCTYPE html>

<head>

<title>FLASH241 - Réseau Gabonais</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0a;color:#fff;font-family:'Inter',sans-serif;max-width:480px;margin:0 auto;min-height:100vh}
.top{position:sticky;top:0;z-index:50;background:#0a0a0a;display:flex;justify-content:space-between;align-items:center;padding:12px 15px;border-bottom:1px solid #1a1a1a}
.logo{font-weight:900;font-size:22px;user-select:none;cursor:pointer}.logo span{color:#FFD600}
.view{display:none;padding-bottom:80px}.view.active{display:block}
.card{background:#151515;border:1px solid #1e1e1e;border-radius:16px;padding:14px;margin:10px}
.btn{padding:12px 18px;border-radius:100px;border:none;font-weight:900;cursor:pointer;width:100%}.btn:active{transform:scale(0.98)}.btn-yellow{background:#FFD600;color:#000}.btn-dark{background:#222;color:#fff}
.avatar{width:40px;height:40px;border-radius:50%;background:#FFD600;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;background-size:cover;background-position:center}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;outline:none;margin-top:6px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0a0a0a;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;padding:8px 0;z-index:60}.bottom div{text-align:center;font-size:10px;color:#666;flex:1;cursor:pointer;padding:6px}.bottom div.active{color:#FFD600}
.badge-live{background:#ff0033;color:#fff;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:900;margin-left:6px}
.badge-lock{background:#333;color:#888;font-size:10px;padding:3px 8px;border-radius:20px}
.post-action{display:flex;gap:12px;margin-top:10px;font-size:13px}.post-action span{cursor:pointer;padding:6px 10px;border-radius:20px;background:#1a1a1a}
.progress{height:6px;background:#222;border-radius:10px;overflow:hidden;margin-top:6px}.progress-bar{height:100%;background:#FFD600}
.onboard{position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column;padding:20px;justify-content:center;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:none;align-items:flex-end;justify-content:center}.modal.active{display:flex}.modal-box{background:#181818;border-radius:20px 20px 0 0;padding:18px;width:100%;max-height:85vh;overflow-y:auto;border-top:1px solid #333}
.option-btn{width:100%;text-align:left;padding:14px 12px;background:#1e1e1e;border:none;color:#fff;border-radius:12px;margin-top:8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}.option-btn.danger{background:#2a1010;color:#ff4444}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#151515;border-radius:12px;margin-top:8px}
</style>
</head>
<body>

<div id="onboard" class="onboard">

<p style="color:#888;margin-top:6px">Comme WhatsApp - Gabon d'abord 🇬🇦</p>
<div style="text-align:left;margin-top:20px">
<label style="font-size:12px;color:#aaa">Nom</label><input id="regName" class="input" placeholder="Ex: Davin Noctambule">
<label style="font-size:12px;color:#aaa;display:block;margin-top:10px">Numéro +241</label><input id="regNum" class="input" placeholder="24165538087" type="tel">
<button class="btn btn-yellow" style="margin-top:18px" onclick="register()">ENTRER →</button>

</div>
</div>
