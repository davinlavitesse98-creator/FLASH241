<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLASH241</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:sans-serif;max-width:480px;margin:0 auto}.top{position:sticky;top:0;z-index:50;background:#0a0a0a;display:flex;justify-content:space-between;padding:12px 15px;border-bottom:1px solid #222}.logo{font-weight:900;font-size:22px}.logo span{color:#FFD600}.view{display:none;padding-bottom:90px}.view.active{display:block}.card{background:#151515;border:1px solid #222;border-radius:16px;padding:14px;margin:10px}.btn{padding:12px;border-radius:100px;border:none;font-weight:900;width:100%}.btn-y{background:#FFD600;color:#000}.btn-d{background:#222;color:#fff}.avatar{width:40px;height:40px;border-radius:50%;background:#FFD600;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;background-size:cover}.input{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;margin-top:6px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0}.bottom div{text-align:center;font-size:10px;color:#666;flex:1;padding:6px}.bottom div.active{color:#FFD600}.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:none;align-items:flex-end;justify-content:center}.modal.active{display:flex}.box{background:#181818;border-radius:20px 20px 0 0;padding:18px;width:100%;max-height:85vh;overflow-y:auto}.opt{width:100%;text-align:left;padding:14px;background:#1e1e1e;border:none;color:#fff;border-radius:12px;margin-top:8px;display:flex;justify-content:space-between}.onboard{position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column;padding:20px;justify-content:center;text-align:center}</style></head><body>
<div id="onboard" class="onboard"><h1>FLASH<span style="color:#FFD600">241</span></h1><p style="color:#888;margin-top:6px">Gabon d'abord - Bloqué ? Tape 241241</p><div style="text-align:left;margin-top:20px"><label style="font-size:12px;color:#aaa">Nom</label><input id="regName" class="input" placeholder="Davin Noctambule"><label style="font-size:12px;color:#aaa;display:block;margin-top:10px">Numero WhatsApp</label><input id="regNum" class="input" placeholder="24165538087"><button class="btn btn-y" style="margin-top:18px" onclick="register()">ENTRER →</button><p id="codeUsed" style="font-size:11px;color:#555;margin-top:10px"></p></div></div>
<div class="top"><div class="logo" onclick="godTap()">FLASH<span>241</span></div><div id="myNum" style="font-size:11px;color:#888"></div></div>
<div id="view-home" class="view active"><div style="display:flex;gap:8px;padding:10px 15px"><input id="postInput" class="input" style="margin:0" placeholder="Quoi de neuf ?"><button class="btn btn-y" style="width:auto;padding:10px 16px" onclick="quickPost()">POST</button></div><div style="display:flex;gap:8px;padding:0 15px"><button class="btn btn-d" style="flex:1;font-size:11px" onclick="createChannel('Groupe')">Groupe</button><button class="btn btn-d" style="flex:1;font-size:11px" onclick="createChannel('Communauté')">Commu</button><button class="btn btn-d" style="flex:1;font-size:11px" onclick="createChannel('Chaîne')">Chaîne</button></div><div id="feed"></div></div>
<div id="view-chat" class="view"><div style="padding:12px 15px;font-weight:900;display:flex;justify-content:space-between"><span>Chats</span><span style="color:#FFD600;font-size:13px" onclick="newChat()">+ Nouveau</span><span style="color:#FFD600;font-size:13px" onclick="inviteContact()">Inviter</span></div><div id="chatList"></div></div>
<div id="view-profil" class="view"><div style="padding:20px;text-align:center"><input type="file" id="photoInput" accept="image/*" style="display:none" onchange="changePhoto(this)"><div id="av" class="avatar" style="width:90px;height:90px;font-size:32px;margin:0 auto" onclick="document.getElementById('photoInput').click()">D</div><p style="font-size:11px;color:#FFD600;margin-top:8px">Touche photo pour changer</p><h2 id="pName" style="margin-top:10px"></h2><p id="pNum" style="color:#888"></p></div><div style="padding:0 15px"><div class="card" onclick="document.getElementById('photoInput').click()">Changer photo <span style="float:right;color:#FFD600">Changer</span></div><div class="card" onclick="inviteContact()">Inviter WhatsApp <span style="float:right;color:#FFD600">Inviter</span></div><div class="card" onclick="createChannel('Groupe')">Creer Groupe <span style="float:right;color:#FFD600">Creer</span></div><div class="card" style="color:#ff4444" onclick="logout()">Deconnexion / Reset</div></div></div>
<div class="bottom"><div class="active" onclick="switchView('home',this)"><div style="font-size:20px">🏠</div>Accueil</div><div onclick="switchView('chat',this)"><div style="font-size:20px">💬</div>Chat</div><div onclick="switchView('profil',this)"><div style="font-size:20px">👤</div>Profil</div></div>
<div id="postMenu" class="modal" onclick="if(event.target==this)this.classList.remove('active')"><div class="box"><h3>Options</h3><button class="opt" onclick="doReport()">🚩 Signaler ce post</button><button class="opt" onclick="doBlock()">🚫 Bloquer l'auteur</button><button class="opt" onclick="doUnblock()">✅ Debloquer l'auteur</button><button class="opt" style="color:#ff4444" onclick="doDelete()">🗑️ Effacer / Cacher</button><button class="opt" onclick="document.getElementById('postMenu').classList.remove('active')" style="justify-content:center">Annuler</button></div></div>
<div id="reportMenu" class="modal" onclick="if(event.target==this)this.classList.remove('active')"><div class="box"><h3>Pourquoi signaler ?</h3><button class="opt" style="background:#3a1111;color:#ff6666" onclick="submitReport('nudite')">Nudite = BAN DEFINITIF</button><button class="opt" onclick="submitReport('insulte')">Insulte = BAN 3H</button><button class="opt" onclick="submitReport('illicite')">Arnaque = BAN apres 2</button></div></div>
<div id="channelModal" class="modal" onclick="if(event.target==this)this.classList.remove('active')"><div class="box"><h3 id="cTitle"></h3><div id="cBody" style="margin-top:12px"></div><button class="btn btn-d" style="margin-top:12px" onclick="document.getElementById('channelModal').classList.remove('active')">Fermer</button></div></div>
<script>
let user=JSON.parse(localStorage.getItem('f241_user')||'null');
let channels=JSON.parse(localStorage.getItem('f241_channels')||'[{"id":"1","name":"Noctambule TV","type":"Chaîne","owner":"Noctambule","ownerNum":"+24165538087","followers":2847,"text":"FLASH241 est la ! Gabon d'abord","likes":1200,"blocked":[]},{"id":"2","name":"Libreville Buzz","type":"Communauté","owner":"L Oiseau","ownerNum":"+24162223344","followers":1203,"text":"Actu Libreville en direct","likes":450,"blocked":[]}]');
let chats=JSON.parse(localStorage.getItem('f241_chats')||'[]');let reports=JSON.parse(localStorage.getItem('f241_reports')||'[]');let cur=null;let taps=0;
function init(){if(!user){document.getElementById('onboard').style.display='flex';return;}document.getElementById('onboard').style.display='none';document.getElementById('myNum').innerText=user.num;document.getElementById('pName').innerText=user.name;document.getElementById('pNum').innerText=user.num;let a=document.getElementById('av');a.innerText=user.name[0].toUpperCase();let s=localStorage.getItem('f241_photo');if(s){a.style.backgroundImage='url('+s+')';a.innerText='';}render();}
function register(){let n=document.getElementById('regName').value.trim();let m=document.getElementById('regNum').value.trim();if(n==='241241'||m==='241241'){document.getElementById('codeUsed').innerText='Code DIEU active';openGodDirect();return;}if(n.length<2||m.length<5){alert('Nom et numero obligatoire');return;}if(!m.startsWith('+'))m='+'+m;user={name:n,num:m};localStorage.setItem('f241_user',JSON.stringify(user));init();}
function godTap(){taps++;if(taps>=5){openGodDirect();taps=0;}setTimeout(()=>{taps=0;},2000);}
function openGodDirect(){let c=prompt('CODE DIEU ?');if(c!=='241241'){if(c!==null)alert('Code invalide');return;}openGodPanel();}
function openGodPanel(){let h='<b>TOI:</b> '+(user?user.name+' '+user.num:'Secours')+'<br><br><b>CHAINES:</b><br>'+channels.map(x=>x.name+' ('+x.followers+') '+x.ownerNum).join('<br>')+'<br><br><b>SIGNALEMENTS:</b> '+reports.length+'<br><br><button class=btn style=background:#FFD600;color:#000 onclick=boostAll()>PASSER A 3000 LIVE</button><br><br><button class=btn style=background:#222;color:#fff;margin-top:8px onclick=unblockAll()>DEBLOQUER TOUT</button><br><br><button class=btn style=background:#550000;color:#fff;margin-top:8px onclick=resetAll()>RESET TOTAL</button>';document.getElementById('cTitle').innerHTML='PANNEAU DIEU';document.getElementById('cBody').innerHTML=h;document.getElementById('channelModal').classList.add('active');}
function switchView(v,el){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');document.querySelectorAll('.bottom div').forEach(x=>x.classList.remove('active'));el.classList.add('active');}
function render(){let f=document.getElementById('feed');f.innerHTML='';channels.forEach(ch=>{if(user&&ch.blocked.includes(user.num))return;let live=ch.followers>=3000;f.innerHTML+='<div class=card><div style=display:flex;justify-content:space-between><div style=display:flex;gap:10px><div class=avatar>'+ch.name[0]+'</div><div><b>'+ch.name+'</b> '+(live?'<span style=background:#ff0033;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px>LIVE</span>':'')+'<br><span style=font-size:11px;color:#888>'+ch.type+' . '+ch.followers+' followers</span></div></div><div style=font-size:22px;cursor:pointer onclick=openPostMenu(\''+ch.id+'\')>...</div></div><div style=margin-top:10px>'+ch.text+'</div><div style=display:flex;gap:12px;margin-top:12px;font-size:13px><span onclick=like(\''+ch.id+'\')>Like '+ch.likes+'</span><span onclick=openChannel(\''+ch.id+'\')>Voir</span><span onclick=openPostMenu(\''+ch.id+'\')>Options</span></div></div>';});localStorage.setItem('f241_channels',JSON.stringify(channels));renderChats();}
function renderChats(){let cl=document.getElementById('chatList');cl.innerHTML=chats.length?'':'<p style=color:#666;text-align:center;margin-top:20px>Aucun chat. Clique Inviter</p>';chats.forEach(c=>{cl.innerHTML+='<div class=card style=display:flex;justify-content:space-between><div><b>'+c.name+'</b><br><span style=font-size:12px;color:#888>'+c.last+'</span></div><div><span onclick=inviteContact() style=margin-right:10px>Inviter</span><span onclick=deleteChat(\''+c.id+'\')>Del</span></div></div>';});}
function quickPost(){let t=document.getElementById('postInput').value.trim();if(!t)return;if(t==='241241'){openGodDirect();document.getElementById('postInput').value='';return;}channels.unshift({id:Date.now().toString(),name:user.name,type:'Chaîne',owner:user.name,ownerNum:user.num,followers:1,text:t,likes:0,blocked:[]});document.getElementById('postInput').value='';render();}
function createChannel(type){let n=prompt('Nom du '+type+' ?');if(!n)return;let d=prompt('Description ?');channels.unshift({id:Date.now().toString(),name:n,type:type,owner:user.name,ownerNum:user.num,followers:10,text:d||'Bienvenue sur '+n,likes:0,blocked:[]});render();}
function openPostMenu(id){cur=id;document.getElementById('postMenu').classList.add('active');}
function doReport(){document.getElementById('postMenu').classList.remove('active');document.getElementById('reportMenu').classList.add('active');}
function doBlock(){let ch=channels.find(c=>c.id===cur);if(!ch.blocked.includes(user.num))ch.blocked.push(user.num);document.getElementById('postMenu').classList.remove('active');render();alert('Auteur bloque');}
function doUnblock(){let ch=channels.find(c=>c.id===cur);ch.blocked=ch.blocked.filter(n=>n!==user.num);document.getElementById('postMenu').classList.remove('active');render();alert('Auteur debloque');}
function unblockAll(){channels.forEach(c=>c.blocked=[]);render();alert('Tout debloque');}
function doDelete(){let ch=channels.find(c=>c.id===cur);if(ch.ownerNum!==user.num){if(!ch.blocked.includes(user.num))ch.blocked.push(user.num);}else{channels=channels.filter(c=>c.id!==cur);}document.getElementById('postMenu').classList.remove('active');render();}
function submitReport(r){let ch=channels.find(c=>c.id===cur);reports.unshift({post:ch.name,reason:r});localStorage.setItem('f241_reports',JSON.stringify(reports));document.getElementById('reportMenu').classList.remove('active');if(r==='nudite'){channels=channels.filter(c=>c.id!==cur);alert('Nudite BAN DEF');}else alert('Signale: '+r);render();}
function like(id){channels.find(c=>c.id===id).likes++;render();}
function openChannel(id){let ch=channels.find(c=>c.id===id);let live=ch.followers>=3000;document.getElementById('cTitle').innerHTML=ch.name;document.getElementById('cBody').innerHTML='<p style=font-size:12px;color:#888>'+ch.followers+' / 3000 pour LIVE</p><div style=margin-top:10px;display:flex;gap:6px'><button class=btn-d style=flex:1 onclick=follow(\''+id+'\')>Suivre</button>'+(live?'<button class=btn style=flex:1;background:#FFD600;color:#000>LIVE</button>':'<button class=btn-d style=flex:1;opacity:.5>LIVE a 3k</button>')+'</div><div style=margin-top:10px;display:flex;gap:6px'><button class=btn-d style=flex:1 onclick=boost(\''+id+'\')>+1000</button><button class=btn-d style=flex:1 onclick=inviteContact()>Inviter</button></div>';document.getElementById('channelModal').classList.add('active');}
function follow(id){channels.find(c=>c.id===id).followers++;render();openChannel(id);}
function boost(id){channels.find(c=>c.id===id).followers+=1000;render();openChannel(id);}
function boostAll(){channels.forEach(c=>c.followers=3000);render();alert('Toutes a 3000 LIVE OK');}
function newChat(){let n=prompt('Nom du contact ?');if(!n)return;chats.unshift({id:Date.now().toString(),name:n,last:'Nouveau chat'});localStorage.setItem('f241_chats',JSON.stringify(chats));renderChats();}
function inviteContact(){let url=location.href;let txt='Rejoins-moi sur FLASH241 Gabon : '+url;let wa='https://wa.me/?text='+encodeURIComponent(txt);window.open(wa,'_blank');}
function deleteChat(id){chats=chats.filter(c=>c.id!==id);localStorage.setItem('f241_chats',JSON.stringify(chats));renderChats();}
function changePhoto(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{let a=document.getElementById('av');a.style.backgroundImage='url('+e.target.result+')';a.innerText='';localStorage.setItem('f241_photo',e.target.result);};r.readAsDataURL(f);}
function logout(){if(confirm('Reset ?')){localStorage.clear();location.reload();}}
function resetAll(){if(confirm('RESET TOTAL ?')){localStorage.clear();location.reload();}}
init();
</script></body></html>
